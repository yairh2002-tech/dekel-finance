<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ליווי פיננסי לעסק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: app shell with a side rail (businesses, then grouped views) beside white cards on a cool tinted ground; cobalt accent, color-coded figures */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --display:"Rubik","Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --sans:"Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --bg:#F3F5FB; --sheet:#FFFFFF; --sheet-2:#F4F6FC; --rail:#101936; --on-rail:#C6CEE6; --rail-on:#FFFFFF; --rail-hi:#1E2B57;
  --ink:#121A33; --ink-2:#4B5675; --ink-3:#7B86A3;
  --line:#E1E6F2; --line-2:#EDF0F8;
  --accent:#2F5BEA; --on-accent:#FFFFFF; --focus:#2F5BEA; --accent-t:#EAF0FF;
  --pos:#0E9F6E; --pos-t:#E3F7EF; --neg:#E0364A; --neg-t:#FDECEE; --warn:#B86E00; --warn-t:#FFF3DC;
  --amber:#F5A524; --rose:#F2647A; --cash:#F5A524; --card:#2F5BEA;
  --shadow:0 1px 2px rgba(18,26,51,.04),0 8px 24px -16px rgba(18,26,51,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1020; --sheet:#141B31; --sheet-2:#1A2340; --rail:#0E152B; --on-rail:#A9B3D1; --rail-on:#FFFFFF; --rail-hi:#1E2B57;
    --ink:#EEF1FA; --ink-2:#B4BDD8; --ink-3:#8590B0;
    --line:#263154; --line-2:#1E2846;
    --accent:#7C9BFF; --on-accent:#0B1020; --focus:#9DB4FF; --accent-t:#1C2A57;
    --pos:#3DD6A0; --pos-t:#11362E; --neg:#FF7A88; --neg-t:#3D1A24; --warn:#F3B95B; --warn-t:#3A2C12;
    --amber:#F3B95B; --rose:#FF8FA0; --cash:#F3B95B; --card:#7C9BFF;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1020; --sheet:#141B31; --sheet-2:#1A2340; --rail:#0E152B; --on-rail:#A9B3D1; --rail-on:#FFFFFF; --rail-hi:#1E2B57;
  --ink:#EEF1FA; --ink-2:#B4BDD8; --ink-3:#8590B0;
  --line:#263154; --line-2:#1E2846;
  --accent:#7C9BFF; --on-accent:#0B1020; --focus:#9DB4FF; --accent-t:#1C2A57;
  --pos:#3DD6A0; --pos-t:#11362E; --neg:#FF7A88; --neg-t:#3D1A24; --warn:#F3B95B; --warn-t:#3A2C12;
  --amber:#F3B95B; --rose:#FF8FA0; --cash:#F3B95B; --card:#7C9BFF;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--rail);color:var(--on-rail);padding:22px 14px 28px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{font:700 26px/1 var(--display);color:var(--rail-on);padding:0 10px;display:flex;flex-direction:column;gap:6px}
.brand small{font:400 12.5px/1.2 var(--sans);color:var(--on-rail)}
.rail-l{font-size:11.5px;font-weight:500;color:var(--on-rail);opacity:.7;padding:0 10px;margin-bottom:4px}
.tabs,.views{display:flex;flex-direction:column;gap:2px}
.tab,.views button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:500;font-size:14.5px;color:var(--on-rail);overflow:hidden}
.tab span,.views button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover,.views button:hover{background:var(--rail-hi);color:var(--rail-on)}
.tab.on{background:var(--rail-hi);color:var(--rail-on)}
.tab::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--hue,var(--on-rail))}
.tab-add{color:var(--on-rail);opacity:.8;font-size:13.5px}
.tab-add::before{display:none}
.views button.on{background:var(--accent);color:var(--on-accent)}
.views svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.views .rail-l{margin-top:14px}
.tab:focus-visible,.views button:focus-visible{outline:2px solid var(--rail-on);outline-offset:-2px}
.hue-0{--hue:#F5A524}.hue-1{--hue:#22B8A7}.hue-2{--hue:#B36AE2}.hue-3{--hue:#F2647A}.hue-4{--hue:#5B8CFF}.hue-5{--hue:#8BC34A}

.main{min-width:0;padding-block:22px 56px;padding-inline:clamp(16px,3vw,36px);max-width:1280px;width:100%}
.sheet-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.sheet-head h1{font:700 clamp(24px,3vw,32px)/1.15 var(--display);overflow-wrap:anywhere}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.vhead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin-top:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.vhead h2{font:600 21px/1.25 var(--display)}
.vhead p{font-size:14px;color:var(--ink-2);margin-top:2px}
.period{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-2);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px}
.period b{font:600 15.5px/1.2 var(--display);color:var(--ink);min-width:8.2em;text-align:center}
.period .btn.sm{font-size:18px;line-height:1;padding:3px 11px 5px;border-color:transparent;background:var(--sheet-2)}
.period .btn.ghost{font-size:12.5px;padding:5px 9px;background:none}
.view{padding-top:18px}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--neg-t);color:var(--neg);font-size:13.5px}
.banner:empty{display:none}

/* text bits */
h2{font:600 17px/1.3 var(--display)}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px;box-shadow:var(--shadow);min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sec-h .actions{gap:6px}
.cap{font-size:13px;color:var(--ink-3)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--ink-3)}.warn{color:var(--warn)}
.b{font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.even{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols>section:not(.sec){min-width:0}
.mt8{margin-top:8px}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr);gap:0}}

/* figures: the equation tiles */
.eqwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,300px);gap:16px;align-items:stretch}
.eq{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.eq>.eq-term{flex:1 1 150px}
.eq-g{display:flex;align-items:stretch;gap:10px;flex:1 1 174px;min-width:0}
.eq-term{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 14px;box-shadow:var(--shadow)}
.eq-label{font-size:13px;color:var(--ink-2);font-weight:500}
.eq-num{font:700 clamp(21px,2.1vw,27px)/1.1 var(--display);overflow-wrap:anywhere}
.eq-num.sm{font-size:clamp(19px,2.1vw,24px)}
.eq-sub{font-size:12.5px;color:var(--ink-2)}
.eq-delta{font-size:12.5px;color:var(--ink-3);min-height:19px}
.eq-op{align-self:center;flex:none;font:600 20px/1 var(--display);color:var(--ink-3);width:14px;text-align:center}
.eq.sm{margin-bottom:4px}
.eqwrap .eq>.eq-term{background:var(--accent-t);border-color:transparent}
.eqwrap .eq>.eq-term .eq-num{color:var(--accent)}
.eqwrap .eq-g:nth-child(2) .eq-term{background:var(--warn-t);border-color:transparent}
.eqwrap .eq-g:nth-child(3) .eq-term{background:var(--sheet-2);border-color:transparent}
.eqwrap .eq-term:has(.eq-num.pos){background:var(--pos-t);border-color:transparent}
.eqwrap .eq-term:has(.eq-num.neg){background:var(--neg-t);border-color:transparent}
.owed{display:grid;gap:2px;align-content:start;font-size:14px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:10px 8px;box-shadow:var(--shadow)}
.owed button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:8px 10px;border-radius:10px}
.owed button:hover{background:var(--sheet-2)}
.owed button:focus-visible{outline:2px solid var(--focus)}
.owed button span{color:var(--ink-2)}
.owed b{font-weight:600}
.owed>div{padding:0 10px 6px;font-size:13px}
@media (max-width:1100px){.eqwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.eq-g{flex-basis:100%}}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-t)}
.btn.danger{color:var(--neg)}
.btn.ghost.danger:hover{background:var(--neg-t)}
.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:8px 11px;min-height:40px}
.in:hover{border-color:var(--ink-3)}
.in:disabled{background:var(--sheet-2);color:var(--ink-2)}
.in.filled{border-color:var(--pos);background:var(--pos-t)}
.in.nar{width:92px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.f.inl{flex-direction:row;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.g2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--sheet-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;align-self:flex-start;max-width:100%;overflow-x:auto}
.dl-b>.seg{justify-self:start}
.seg button{border:none;background:none;padding:6px 13px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--sheet);color:var(--accent);box-shadow:0 1px 3px rgba(18,26,51,.14)}
.seg button:disabled{cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto;flex:0 1 180px}
.toolbar .grow{flex:1 1 220px}
.toolbar .in.nar{flex:0 0 92px}
.toolbar .sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.chk.top{align-self:end;padding-bottom:10px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* tables */
.scroll{overflow-x:auto}
#vbody>.scroll,#view>.scroll{background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;font-size:12.5px;color:var(--ink-3);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer}
.tbl th button:hover{color:var(--accent)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .r{text-align:end}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--sheet-2)}
.tbl tfoot td{border-top:1.5px solid var(--ink);border-bottom:none;font-weight:600}
.tbl .sub{display:block;font-size:12.5px;color:var(--ink-3)}
.tbl .cut{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .cut.nar{max-width:120px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hue,var(--ink));margin-inline-end:8px}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.chip.paid{color:var(--pos);background:var(--pos-t)}.chip.open{color:var(--ink-2);background:var(--sheet-2)}.chip.late{color:var(--neg);background:var(--neg-t)}.chip.fc{color:var(--warn);background:var(--warn-t)}
.more{display:flex;justify-content:center;margin-top:14px}

/* bars */
.hb{display:grid;grid-template-columns:minmax(90px,36%) minmax(40px,1fr) minmax(78px,auto);gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.hb>div:last-child{text-align:end}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.hb-t i{display:block;height:100%;width:0;background:var(--rose);border-radius:999px}
.hb-t i.g{background:var(--pos)}
.hb-t i.dir{background:var(--amber)}
.mini{height:8px;min-width:70px;background:var(--line-2);border-radius:999px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px}

/* charts */
.chart{overflow-x:auto;direction:ltr}
.chart svg{display:block}
.chart text{font:11px var(--sans);fill:var(--ink-3)}
.gl{stroke:var(--line-2);stroke-width:1}
.zl{stroke:var(--line);stroke-width:1.5}
.b-in{fill:var(--accent)}.b-out{fill:var(--rose)}
.b-cash{fill:var(--cash)}.b-card{fill:var(--card)}
.b-fc{opacity:.38}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ln-fc{stroke-dasharray:5 5}
.ar{fill:var(--accent);opacity:.1}
.pt{fill:var(--sheet);stroke:var(--accent);stroke-width:2.5}
.hit{fill:transparent}
.hit:hover{fill:var(--ink);opacity:.05}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend .li-in{background:var(--accent)}.legend .li-out{background:var(--rose)}
.legend .li-cash{background:var(--cash)}.legend .li-card{background:var(--card)}
.legend .li-fc{background:var(--ink-3);opacity:.45}

/* states */
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:16px;padding:36px clamp(18px,4vw,40px);max-width:640px}
.empty h2{font:700 24px/1.2 var(--display);margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:18px}
.empty .row{display:flex;flex-wrap:wrap;gap:8px}
.empty .row .in{flex:1 1 220px;width:auto}
.note{font-size:13.5px;color:var(--ink-2);background:var(--sheet-2);border-radius:10px;padding:9px 13px;margin-top:12px}
.note.warn{background:var(--warn-t);color:var(--ink)}
.note.neg{background:var(--neg-t);color:var(--neg)}
.ai p{max-width:68ch;white-space:pre-wrap;margin-top:10px}

/* monthly report matrix */
.mxwrap{padding:0!important}
.mx{font-size:13.5px;border-collapse:separate;border-spacing:0}
.mx th,.mx td{white-space:nowrap}
.mx th:first-child,.mx td:first-child{position:sticky;inset-inline-start:0;background:var(--sheet);z-index:1;min-width:170px;max-width:46vw;white-space:normal;border-inline-end:1px solid var(--line);padding-inline-start:18px}
.mx td.r,.mx th.r{min-width:84px}
.mx .cur{background:var(--accent-t)}
.mx th.cur{color:var(--accent);font-weight:600}
.mx .fut{color:var(--ink-3)}
.mx .tot{border-inline-start:1px solid var(--line);font-weight:600;padding-inline-end:18px}
.mx tr.hd td{font:600 14px/1.3 var(--display);color:var(--accent);padding-top:20px;background:var(--sheet);position:static;max-width:none;border-inline-end:none;border-bottom:1px solid var(--line)}
.mx tr.hd span{position:sticky;inset-inline-start:18px;display:inline-block}
.mx .zero{color:var(--line)}
.mx tr.ind td:first-child{padding-inline-start:32px;color:var(--ink-2)}
.mx tr.b td{font-weight:600}
.mx tr.mut td{color:var(--ink-3)}
.mx tr.rule td{border-top:1.5px solid var(--ink)}
.mx tr.rule td,.mx tr.dbl td{background:var(--sheet-2)}
.mx tr.rule td.cur,.mx tr.dbl td.cur{background:var(--accent-t)}
.mx td[data-act]{cursor:pointer}
.mx td[data-act]:hover{background:var(--line-2)}

.menu{display:grid;gap:8px}
.menu button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;padding:13px 15px;border:1px solid var(--line);border-radius:12px}
.menu button:hover{border-color:var(--accent);background:var(--accent-t)}
.menu button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.menu b{font-weight:600}.menu span{font-size:13.5px;color:var(--ink-2)}
.plainlist{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.tasks{list-style:none;margin:0;padding:6px 18px;max-width:780px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tasks li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-2)}
.tasks li:last-child{border-bottom:none}
.tasks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.tasks input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--pos)}
.tasks .sub{display:block;font-size:12.5px;color:var(--ink-3)}
.tasks li.done label>span{color:var(--ink-3);text-decoration:line-through}

/* dialog */
dialog{border:none;border-radius:18px;background:var(--sheet);color:var(--ink);padding:0;width:min(580px,calc(100vw - 20px));max-height:calc(100vh - 28px);overflow:auto;box-shadow:0 24px 70px -20px rgba(8,14,36,.5)}
dialog.wide{width:min(840px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(8,14,36,.5)}
.dl-h{padding:22px 24px 0}
.dl-h h2{font:700 21px/1.2 var(--display)}
.dl-b{padding:16px 24px;display:grid;gap:13px}
.dl-f{padding:14px 24px 20px;display:flex;flex-wrap:wrap;gap:8px}
.dl-f .sp{flex:1}
.err{color:var(--neg);font-size:13.5px}
.err:empty{display:none}
.filebox{border:1.5px dashed var(--accent);border-radius:12px;padding:13px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px;color:var(--ink-2);background:var(--accent-t)}
.filebox .fname{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.filebox .st{flex-basis:100%}
.preview{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--hue);cursor:pointer}
.swatches button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--sheet)}
progress{width:100%;height:8px;accent-color:var(--accent)}

#tip{position:fixed;z-index:60;pointer-events:none;display:none;background:var(--ink);color:var(--sheet);font-size:12.5px;line-height:1.5;padding:7px 11px;border-radius:8px;white-space:pre-line;max-width:240px}
#toast{position:fixed;z-index:70;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;pointer-events:none}
#toast div{pointer-events:auto;background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 24px)}
#toast button{all:unset;cursor:pointer;font-weight:600;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.hb-t i,.mini i{transition:width .35s ease}}

/* narrow screens: the rail becomes a header with two scrolling rows */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);min-height:0}
  .side{position:static;height:auto;padding:14px 12px 10px;gap:10px;overflow:visible}
  .brand{flex-direction:row;align-items:baseline;gap:10px;font-size:22px;padding:0 4px}
  .side .rail-l{display:none}
  .tabs,.views{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar,.views::-webkit-scrollbar{display:none}
  .tab,.views button{flex:none;padding:7px 12px;font-size:14px;overflow:visible}
  .main{padding-block:16px 48px}
}
.mb10{margin-bottom:10px}
.flags{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.flag{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--sheet-2);border-inline-start:4px solid var(--ink-3)}
.flag.red{background:var(--neg-t);border-inline-start-color:var(--neg)}
.flag.amber{background:var(--warn-t);border-inline-start-color:var(--amber)}
.flag b{font-weight:600}
.flag p{font-size:13.5px;color:var(--ink-2);margin-top:2px;max-width:80ch}
.flag .btn{flex:none}
.badge{font-style:normal;margin-inline-start:auto;background:var(--neg);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;line-height:19px;min-width:19px;text-align:center;padding:0 6px}
.okbox{background:var(--pos-t);border-color:transparent}
@media (max-width:560px){.flag{flex-direction:column;align-items:flex-start}}
.rail-set{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:500;font-size:14.5px;color:var(--on-rail);margin-top:auto}
.rail-set:hover{background:var(--rail-hi);color:var(--rail-on)}
.rail-set:focus-visible{outline:2px solid var(--rail-on);outline-offset:-2px}
.rail-set svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#brandName{overflow-wrap:anywhere}
@media (max-width:900px){.rail-set{position:absolute;inset-inline-end:12px;top:12px;margin:0;padding:7px 10px}.rail-set span{display:none}.side{position:relative}}
/* report: month headers stay on screen while scrolling */
.mxwrap{max-height:calc(100vh - 140px);overflow:auto}
.mx thead th{position:sticky;top:0;z-index:2;background:var(--sheet);color:var(--ink);font-weight:700;font-size:13.5px;border-bottom:2px solid var(--ink);box-shadow:0 1px 0 var(--line)}
.mx thead th.cur{background:var(--accent-t);color:var(--accent)}
.mx thead th:first-child{z-index:3}
.tiles{margin-top:2px}
.tiles .eq-term{flex:1 1 200px}
.tiles .t-acc{background:var(--accent-t);border-color:transparent}.tiles .t-acc .eq-num{color:var(--accent)}
.tiles .t-warn{background:var(--warn-t);border-color:transparent}
.tiles .t-pos{background:var(--pos-t);border-color:transparent}
.tiles .t-neg{background:var(--neg-t);border-color:transparent}
.bkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-2)}
.bkrow span{margin-inline-end:auto}

.rail-local{margin:8px 12px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.45;color:var(--rail-ink, #cdd3e6);background:rgba(255,255,255,.08)}
</style>

async function runPool(items, worker, onProgress, conc) {
  let i = 0, done = 0, failed = null;
  async function next() {
    while (i < items.length && !failed) {
      const it = items[i++];
      try { await worker(it); done++; if (onProgress) onProgress(done); }
      catch (e) { failed = e; }
    }
  }
  await Promise.all(Array.from({length: Math.min(conc || 3, items.length)}, next));
  return {done, error: failed};
}

/* ---------- red flags: rule-based checks on the business's own data ---------- */
function computeFlags(b) {
  const F = [], add = (lv, t, d, view, prep) => F.push({lv, t, d, view, prep});
  const t = today(), cur = t.slice(0, 7), M = pnlActual(b, b.basis), C = cashModel(b, 60), R = Math.round;
  const mine = S.entries.filter(e => e.bizId === b.id), exps = mine.filter(e => e.k === 'e');
  const m$ = v => moneyRaw(v), names = (l, n) => l.slice(0, n || 3).join(', ') + (l.length > (n || 3) ? ' ועוד ' + (l.length - (n || 3)) : '');
  const exAll = o => () => { Object.assign(S.ex, {q: '', cat: '', status: '', method: '', scope: 'all', sub: 'ledger', limit: 150}, o || {}); };

  /* cash */
  const neg = C.rows.find(r => r.bal < 0);
  if (C.start < 0) add('red', 'העו״ש ביתרת חובה', 'היתרה המחושבת להיום היא ' + m$(C.start) + (C.low.bal < C.start ? ', ולפי התחזית היא תרד עד ' + m$(C.low.bal) + ' ב-' + fmtDate(C.low.date) : '') + '.', 'cash');
  else if (neg) add('red', 'היתרה צפויה לרדת למינוס', 'לפי התחזית, ב-' + fmtDate(neg.date) + ' היתרה תהיה ' + m$(neg.bal) + '. הנקודה הנמוכה ב-60 הימים הקרובים: ' + m$(C.low.bal) + ' ב-' + fmtDate(C.low.date) + '.', 'cash');
  else {
    const from = addDays(t, -90), out = exps.reduce((s, e) => (e.ok && expDate(e) > from && expDate(e) <= t ? s + e.a : s), 0) / 90;
    if (out > 0 && C.start / out < 14) add('amber', 'כרית המזומנים דקה', 'היתרה בבנק (' + m$(C.start) + ') מכסה בערך ' + R(C.start / out) + ' ימים של הוצאות בקצב של שלושת החודשים האחרונים.', 'cash');
  }
  /* suppliers and customers overdue */
  const debts = Array.from(openDebt(b).values()), late = debts.filter(o => o.late > 0).sort((x, y) => y.late - x.late), lateT = debts.reduce((s, o) => s + o.late, 0);
  if (lateT > 0) {
    const oldest = exps.filter(e => !e.ok && expDate(e) < t).map(e => expDate(e)).sort()[0];
    add(daysBetween(oldest, t) > 30 ? 'red' : 'amber', 'חשבוניות ספקים באיחור', m$(lateT) + (late.length === 1 ? ' לספק אחד' : ' ל-' + late.length + ' ספקים') + ' (' + names(late.map(o => o.s)) + '). האיחור הוותיק ביותר: ' + daysBetween(oldest, t) + ' ימים.', 'expenses', exAll({status: 'open', sort: 'p', dir: 1}));
  }
  const recvLate = mine.filter(e => e.k === 'i' && !e.ok && expDate(e) < t);
  if (recvLate.length) add('amber', 'לקוחות שלא שילמו בזמן', pl(recvLate.length, 'חשבונית אחת', 'חשבוניות') + ' בסך ' + m$(recvLate.reduce((s, e) => s + e.a, 0)) + ' עברו את מועד התשלום (' + names(Array.from(new Set(recvLate.map(e => e.s || 'ללא שם')))) + ').', 'income');

  /* profitability: the last closed month against the plan and against the three months before it */

const bizDoc = b => ({name: b.name, hue: b.hue, createdAt: b.createdAt || Date.now(), vat: b.vat, taxRate: b.taxRate, basis: b.basis, bank: b.bank, cashDow: b.cashDow, cardDow: b.cardDow, cardLag: b.cardLag, cogsPct: b.cogsPct, supDow: b.supDow, cats: b.cats.map(c => ({n: c.n, g: c.g, v: c.v, p: c.p || ''}))});
async function createBiz(name, hue) {

  S.sel = ref.id; S.view = 'overview'; savePrefs(); resub();

  const from = P.from || cur, base = k => (P.lines[k] && P.lines[k].b != null ? P.lines[k].b : '');
  const d = openDlg('<div class="dl-h"><h2>עריכת תכנון</h2><p class="cap">סכום חודשי קבוע לכל שורה. לחודש חריג קובעים סכום אחר בלחיצה על התא בדוח, במצב תכנון.</p></div><div class="dl-b">' +
    '<div class="g2"><label class="f">התכנון מתחיל בחודש<input class="in" type="month" id="pFromM" value="' + esc(from) + '"></label><label class="f">רווח גולמי מתוכנן, באחוזים<input class="in" id="pGm" inputmode="decimal" dir="ltr" value="' + base('@gm') + '"></label></div>' +
    '<div class="g2"><label class="f">הכנסות בחודש הראשון, כולל מע״מ<input class="in" id="pRev" inputmode="decimal" dir="ltr" value="' + (planVal('@rev', from) || '') + '"></label><label class="f">צמיחה חודשית, באחוזים<input class="in" id="pGrow" inputmode="decimal" dir="ltr" placeholder="0"></label></div>' +
    '<label class="chk"><input type="checkbox" id="pFill"' + (P.lines['@rev'] ? '' : ' checked') + '> למלא מחדש 12 חודשי הכנסות לפי הסכום והצמיחה</label>' +
    '<div class="scroll"><table class="tbl"><thead><tr><th>שורה בדוח</th><th>קבוצה</th><th class="r">סכום חודשי, ללא מע״מ</th></tr></thead><tbody>' +
    lines.map((c, i) => '<tr><td>' + esc(c.n) + '</td><td class="mut">' + GROUP[c.g] + '</td><td class="r"><input class="in nar" data-pl="' + i + '" inputmode="decimal" dir="ltr" aria-label="' + esc(c.n) + '" value="' + base(c.n) + '"></td></tr>').join('') + '</tbody></table></div>' +
    '<p class="err" id="pErr" role="alert"></p></div><div class="dl-f"><button class="btn pri" id="pSave">שמירת התכנון</button><button class="btn" id="pCancel">ביטול</button></div>', true);
  $('#pCancel', d).onclick = closeDlg;
  $('#pSave', d).onclick = async () => {
    const fm = $('#pFromM', d).value, gm = parseNum($('#pGm', d).value), rev = parseNum($('#pRev', d).value), grow = parseNum($('#pGrow', d).value);

  if (window.__LOCAL__) { const n = document.createElement('p'); n.className = 'rail-local'; n.textContent = 'גרסה עצמאית: הנתונים נשמרים בדפדפן הזה בלבד. מורידים גיבוי מלא באופן קבוע מהגדרות העסק.'; const r = $('#bizEdit'); if (r) r.parentNode.insertBefore(n, r); }
  if (!db) return fatal('צריך להיות מחוברים לחשבון Claude כדי לראות את הנתונים בדף הזה.');

  db.collection('businesses').onSnapshot(snap => {

    S.bizLoaded = true; schedule();
  }, onDbErr);
  let rz = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(() => { if (!dlg().open && S.mLoaded) schedule(); }, 160); });
}
